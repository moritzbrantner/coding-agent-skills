name: Validate capabilities

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  capability-catalog:
    name: merge-ready
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Fetch accepted coding-tooling revision
        env:
          CODING_TOOLING_REVISION: d9acd629fe91d3d19baa1f75f1099243e48ca79c
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/moritzbrantner/coding-tooling.git "$RUNNER_TEMP/coding-tooling"
          git -C "$RUNNER_TEMP/coding-tooling" checkout --detach "$CODING_TOOLING_REVISION"
          test "$(git -C "$RUNNER_TEMP/coding-tooling" rev-parse HEAD)" = "$CODING_TOOLING_REVISION"
          bun install --cwd "$RUNNER_TEMP/coding-tooling" --frozen-lockfile
      - name: Run canonical repository validation
        run: |
          export CODING_TOOLING_ROOT="$RUNNER_TEMP/coding-tooling"
          bun "$CODING_TOOLING_ROOT/src/cli.ts" run --tier default --strict --json
      - name: Verify strict conformance
        run: bun "$RUNNER_TEMP/coding-tooling/src/cli.ts" conformance --json
      - name: Inspect deterministic repository findings
        run: |
          mkdir -p .artifacts/coding-tooling
          set +e
          bun "$RUNNER_TEMP/coding-tooling/src/entry.ts" findings --json > .artifacts/coding-tooling/findings.json
          status=$?
          set -e
          cat .artifacts/coding-tooling/findings.json
          exit "$status"
